<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardscrabble</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for efficient CSV reading -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex items-center justify-center p-4">

    <!-- LOADING SCREEN (Shown initially) -->
    <div id="loading-screen" class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 text-center transition-all flex flex-col items-center">
        <h1 class="text-3xl font-extrabold mb-6 text-slate-900">Hardscrabble</h1>
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
        <p class="text-sm text-slate-500" id="loading-text">Downloading and processing dictionary...</p>
    </div>

    <!-- SEARCH SCREEN (Hidden initially) -->
    <div id="search-screen" class="hidden w-full max-w-lg bg-white rounded-2xl shadow-xl p-8 text-center fade-in">
        <div class="flex justify-center items-center mb-8">
            <h1 class="text-2xl font-extrabold text-slate-900">Hardscrabble</h1>
        </div>

        <div class="flex gap-2 relative">
            <input type="text" id="word-input" autocomplete="off" placeholder="Type a word..." class="w-full text-center text-2xl font-semibold border-2 border-slate-200 rounded-xl focus:border-blue-500 outline-none py-3 px-4 transition-colors placeholder:text-slate-300">
            <button id="check-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-colors">Check</button>
        </div>

        <div class="mt-10 min-h-[160px] flex flex-col justify-center items-center">
            <!-- Score Display -->
            <div id="score-display" class="hidden flex-col items-center fade-in">
                <span class="text-slate-400 text-sm font-semibold uppercase tracking-wider mb-2">Score</span>
                <span id="score-value" class="text-7xl font-extrabold text-blue-600 drop-shadow-sm">--</span>
                <span id="score-stats" class="text-xs text-slate-400 mt-4">Raw count: --</span>
            </div>
            
            <!-- Error / Empty State Display -->
            <div id="message-display" class="text-slate-400 text-lg">
                Enter a word above and click Check.
            </div>
        </div>
    </div>

    <script>
        // URL to your public CSV file. Replace this with your actual raw CSV URL 
        // (e.g., from GitHub Pages or a Raw GitHub link)
        const CSV_URL = "https://raw.githubusercontent.com/jasper-dav/hardscrabble_game/main/scored_ngram_freq_dict.csv";

        // Data storage
        const wordMap = new Map();

        // DOM Elements
        const loadingScreen = document.getElementById('loading-screen');
        const searchScreen = document.getElementById('search-screen');
        const wordInput = document.getElementById('word-input');
        const checkBtn = document.getElementById('check-btn');
        const scoreDisplay = document.getElementById('score-display');
        const messageDisplay = document.getElementById('message-display');
        const scoreValue = document.getElementById('score-value');
        const scoreStats = document.getElementById('score-stats');

        // Load CSV automatically on page load
        window.addEventListener('DOMContentLoaded', () => {
            Papa.parse(CSV_URL, {
                download: true, // Tells PapaParse to fetch the file from the URL
                header: true,
                skipEmptyLines: true,
                step: function(results) {
                    const row = results.data;
                    const word = row.word ? String(row.word).trim().toLowerCase() : null;
                    const count = parseFloat(row.count);
                    const points = parseInt(row.points, 10);

                    if (word && !isNaN(count) && !isNaN(points)) {
                        // Store both the count and the exact pre-calculated score from R
                        wordMap.set(word, { count: count, points: points });
                    }
                },
                complete: function() {
                    // Transition to Search UI
                    loadingScreen.classList.add('hidden');
                    searchScreen.classList.remove('hidden');
                    wordInput.focus();
                },
                error: function(error) {
                    console.error("PapaParse Error:", error);
                    document.getElementById('loading-text').textContent = "Failed to load dictionary. Please check the CSV_URL in the code.";
                    document.querySelector('.animate-spin').classList.add('hidden');
                }
            });
        });

        // Function to handle the search
        function checkWord() {
            const query = wordInput.value.trim().toLowerCase();

            if (query === '') {
                scoreDisplay.classList.add('hidden');
                messageDisplay.classList.remove('hidden');
                messageDisplay.textContent = "Enter a word above and click Check.";
                return;
            }

            if (wordMap.has(query)) {
                const data = wordMap.get(query);

                // Update UI using the exact points from the CSV
                scoreValue.textContent = data.points;
                scoreStats.textContent = `Raw count: ${data.count.toLocaleString()}`;
                
                messageDisplay.classList.add('hidden');
                
                // Remove and re-add animation class to trigger it on every valid word
                scoreDisplay.classList.remove('fade-in');
                void scoreDisplay.offsetWidth; // Trigger DOM reflow
                scoreDisplay.classList.add('fade-in');
                scoreDisplay.classList.remove('hidden');
            } else {
                scoreDisplay.classList.add('hidden');
                messageDisplay.classList.remove('hidden');
                messageDisplay.innerHTML = `Word <span class="font-semibold text-slate-700">"${wordInput.value}"</span> not found in dictionary.`;
            }
        }

        // Event Listeners for checking
        checkBtn.addEventListener('click', checkWord);
        wordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                checkWord();
            }
        });

    </script>
</body>
</html>
